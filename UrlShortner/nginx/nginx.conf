worker_processes auto;

events {
    worker_connections 4096;
}

http {
    # L1 rate limiting: coarse, IP-based, blunts abusive traffic before
    # it ever reaches an application process. The finer-grained,
    # per-client token bucket lives in the app layer (Redis Lua script).
    limit_req_zone $binary_remote_addr zone=perip:10m rate=50r/s;

    upstream psbackend {
        least_conn;
        server app1:8000;
        server app2:8000;
        server app3:8000;
    }

    server {
        listen 80;

        location / {
            limit_req zone=perip burst=100 nodelay;

            proxy_pass http://psbackend;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            proxy_connect_timeout 2s;
            proxy_read_timeout 5s;
        }

        location /health {
            access_log off;
            proxy_pass http://psbackend;
        }
    }
}
